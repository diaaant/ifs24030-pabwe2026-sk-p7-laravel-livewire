sonar.projectKey=ifs24030-pabwe2026-php laravel
sonar.projectName=ifs24030-pabwe2026-php laravel

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.js,**/*.test.jsx

sonar.sourceEncoding=UTF-8

sonar.javascript.lcov.reportPaths=coverage/lcov.info

